[storage]
engine = icloud

# Configs that live in ~/.dotfiles and get symlinked by fresh.sh.
# Mackup must not touch them, or `mackup restore` replaces the symlinks with copies.
[applications_to_ignore]
aerospace
bat
btop
claude-code
ghostty
lazygit
mackup
neovim
nushell
opencode
ranger
ripgrep
starship
vim
zsh
# Old tools, no longer used
jankyborders
amethyst
iterm2
kitty
sketchybar
skhd
yabai
# System-wide prefs: risky to restore onto a different macOS version, .macos handles these
macosx
